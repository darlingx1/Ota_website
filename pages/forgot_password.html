<main class="relative z-10 min-h-screen flex items-center justify-center p-6">
<!-- Auth Shell Container -->
<div class="w-full max-w-[480px]">
<!-- Brand Anchor -->
<div class="flex justify-center mb-10">
<div class="flex items-center gap-3">
<span class="w-10 h-10 rounded-lg bg-gradient-to-br from-primary to-primary-dim flex items-center justify-center text-on-primary-container shadow-[0_0_20px_rgba(182,160,255,0.4)]">

</div>

<div class="bg-surface-container/70 backdrop-blur-2xl rounded-xl p-10 shadow-2xl border border-white/5 relative overflow-hidden group">

<div class="absolute top-0 right-0 w-32 h-32 bg-secondary/10 blur-[40px] -translate-y-1/2 translate-x-1/2"></div>
<div class="relative z-10">

<div class="mb-8">

<p class="text-on-surface-variant font-medium leading-relaxed">

                        </p>
</div>
<!-- Reset Form -->
<form class="space-y-6">
<div class="space-y-2">
<label class="block font-label text-xs font-bold uppercase tracking-widest text-on-surface-variant px-1" for="email">
                                Email Address
                            </label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">mail</span>
<input class="w-full bg-surface-container-highest/50 border border-outline-variant/30 rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-300" id="email" name="email" placeholder="your@email.com" required="" type="email"/>
<!-- Neon Glow Border Effect -->
<div class="absolute inset-0 rounded-lg pointer-events-none border border-primary/0 group-focus-within:border-primary/50 group-focus-within:shadow-[0_0_15px_rgba(182,160,255,0.2)] transition-all"></div>
</div>
</div>

<button class="w-full group relative overflow-hidden bg-primary-container text-on-primary-container font-headline font-bold text-lg py-4 rounded-lg shadow-[0_0_30px_rgba(169,143,255,0.2)] hover:shadow-[0_0_40px_rgba(169,143,255,0.4)] active:scale-95 transition-all duration-300" type="submit">
<span class="relative z-10 flex items-center justify-center gap-2">
                                Send Reset Link

</span>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
</button>
