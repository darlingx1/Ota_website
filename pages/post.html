<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Transmission | NEON STAGE</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "surface-container-lowest": "#000000",
                    "outline": "#747486",
                    "error": "#ff6e84",
                    "surface-container-high": "#1d1e31",
                    "secondary": "#03fbfc",
                    "on-surface": "#e5e3f8",
                    "surface-container-low": "#111222",
                    "tertiary": "#ff6c95",
                    "surface": "#0c0d1b",
                    "primary-container": "#a98fff",
                    "surface-container": "#171829",
                    "on-background": "#e5e3f8",
                    "on-primary-container": "#280072",
                    "surface-container-highest": "#232439",
                    "secondary-container": "#006a6a",
                    "on-secondary": "#005c5c",
                    "on-error": "#490013",
                    "on-primary": "#340090",
                    "on-surface-variant": "#aaa9bd",
                    "on-secondary-container": "#d9fffe",
                    "background": "#0c0d1b",
                    "primary": "#b6a0ff",
                    "outline-variant": "#464757",
                    "surface-bright": "#292a41",
                    "tertiary-container": "#fd3e80",
                    "on-tertiary-container": "#100003"
                },
                fontFamily: {
                    "headline": ["Space Grotesk"],
                    "body": ["Manrope"],
                    "label": ["Plus Jakarta Sans"]
                }
            }
        }
    }
</script>
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Manrope', sans-serif; background-color: #0c0d1b; color: #e5e3f8; }
</style>
</head>
<body class="bg-background min-h-screen">

<!-- TopAppBar -->
<header class="bg-[#111222]/70 backdrop-blur-xl fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16">
    <a href="home.html" class="flex items-center gap-3 text-on-surface-variant hover:text-primary transition-colors">
        <span class="material-symbols-outlined">arrow_back</span>
        <span class="text-2xl font-bold tracking-tighter text-indigo-300 font-['Space_Grotesk']">Ota</span>
    </a>
    <span class="text-xs font-label uppercase tracking-widest text-on-surface-variant">Transmission</span>
</header>

<!-- Main Content -->
<main class="pt-24 pb-12 px-4 max-w-2xl mx-auto">

    <!-- Post Card -->
    <div id="post-container" class="bg-surface-container rounded-2xl p-6 relative overflow-hidden mb-6">
        <p class="text-center text-on-surface-variant font-label text-sm py-8">Loading transmission...</p>
    </div>

    <!-- Comments Section -->
    <div id="comments-container" class="space-y-4">
        <h2 class="font-headline font-bold text-lg text-on-surface">Comments</h2>
        <div id="comments-list" class="space-y-3"></div>
        <div class="flex gap-3 items-center mt-4">
            <input
                id="comment-input"
                type="text"
                placeholder="Add a comment..."
                class="flex-1 bg-surface-container-low border-none rounded-full px-4 py-2 text-sm font-body text-on-surface placeholder:text-on-surface-variant/50 focus:ring-1 focus:ring-primary/50"
            />
            <button id="submit-comment" class="text-primary hover:bg-primary/10 p-2 rounded-full transition-colors">
                <span class="material-symbols-outlined">send</span>
            </button>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../post.js"></script>
</body>
</html>
