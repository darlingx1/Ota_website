<div class="relative w-full max-w-lg">
<!-- Asymmetric Decorative Element: Character / Art Bleed -->

<!-- Login Container (Glassmorphism) -->
<div class="glass-panel rounded-xl p-8 md:p-12 shonen-glow relative z-10 overflow-hidden">
<!-- Decorative corner accent -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-2 border-l-2 border-primary/40 rounded-tl-xl pointer-events-none"></div>

<h1 class="font-headline text-4xl md:text-5xl font-bold tracking-tighter text-on-surface mb-3 leading-tight">
                        WELCOME BACK
                    </h1>
<p class="text-on-surface-variant font-label text-sm uppercase tracking-widest opacity-80">
                        Sign in to continue your legacy.
                    </p>
</div>
<form class="space-y-6">
    <div id="error-message" class="hidden bg-error-container/20 border border-error/50 text-error text-[10px] p-3 rounded-lg mb-2 text-center font-label uppercase tracking-widest animate-pulse">
        </div>

    <div class="space-y-2">
        <label class="font-label text-xs font-bold text-primary uppercase tracking-wider block ml-1">Email Address</label>
        <div class="relative">
            <input id="email" class="w-full bg-surface-container-low/50 border border-outline-variant/30 focus:border-primary/50 focus:ring-1 focus:ring-primary/50 text-on-surface rounded-lg px-4 py-4 placeholder:text-outline/50 transition-all outline-none" placeholder="commander@ota.world" type="email" required/>
        </div>
    </div>

    <div class="space-y-2">
    <div class="flex justify-between items-center px-1">
        <label class="font-label text-xs font-bold text-primary uppercase tracking-wider block">Password</label>
        <a href="forgot_password.html" class="text-[10px] font-label text-tertiary-dim uppercase tracking-widest hover:text-tertiary transition-colors">Forgot Password?</a>
    </div>
    <div class="relative">
        <input id="password" class="w-full bg-surface-container-low/50 border border-outline-variant/30 focus:border-primary/50 focus:ring-1 focus:ring-primary/50 text-on-surface rounded-lg px-4 py-4 pr-12 placeholder:text-outline/50 transition-all outline-none" placeholder="••••••••••••" type="password" required/>
        
        <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline/60 hover:text-primary transition-colors focus:outline-none">
            <span id="eyeIcon" class="material-symbols-outlined text-[20px]">visibility</span>
        </button>
    </div>
</div>

    <button class="group relative w-full bg-primary text-on-primary-container font-headline font-bold py-5 rounded-lg overflow-hidden transition-all active:scale-95 hover:shadow-[0_0_30px_rgba(182,160,255,0.4)]" type="submit">
        <span class="relative z-10 tracking-widest">LOG IN</span>
        <div class="absolute inset-0 bg-gradient-to-r from-primary to-primary-dim opacity-0 group-hover:opacity-100 transition-opacity"></div>
    </button>
</form>
<!-- Divider -->
<div class="my-10 flex items-center gap-4">
